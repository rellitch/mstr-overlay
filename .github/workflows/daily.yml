name: MSTR Overlay Daily Monitor

# Scheduled (cron) runs are BEST-EFFORT only. GitHub frequently delays or SKIPS
# scheduled jobs during high-load periods (notably the US market open), so this cron
# is a backup, not a guarantee of timely updates. The cron below *attempts* a run
# roughly half-hourly during market hours (UTC; the hour range spans both DST regimes),
# but in practice many of those attempts never fire. When the dashboard shows its
# staleness banner, force an immediate run from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch: {}

# Serialize runs: if a delayed cron lands while a manual run is still going (or vice
# versa), queue the newer one instead of racing. Prevents two jobs colliding on the
# `git push` below (non-fast-forward). Don't cancel the in-flight run mid-write.
concurrency:
  group: mstr-overlay-log
  cancel-in-progress: false

permissions:
  contents: write          # lets the job save the updated log + dashboard back to the repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests yfinance pandas numpy

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}      # optional (Discord/Slack alerts)
          BTC_HOLDINGS: ${{ secrets.BTC_HOLDINGS }}    # optional (mNAV context)
        run: python mstr_overlay.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Save log + dashboard
        run: |
          git config user.name "mstr-overlay-bot"
          git config user.email "actions@github.com"
          # Push with regenerate-and-retry. A plain `git push` fails whenever main has
          # moved past this run's pinned checkout -- which happens on every "Re-run" of
          # an older run after any newer run has pushed (observed 2026-08-06), and on
          # genuine run races. Since all outputs are deterministic regenerations from
          # fresh data, the fix is: reset to the CURRENT tip, regenerate, push again.
          for attempt in 1 2 3; do
            git add mstr_overlay_log.csv index.html live_snapshot.json
            git diff --staged --quiet || git commit -m "log: $(date -u +%Y-%m-%d) overlay reading"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt): main moved; rebasing onto current tip and regenerating"
            git fetch origin main
            git reset --hard origin/main
            python mstr_overlay.py
            python build_dashboard.py
          done
          echo "push still failing after 3 attempts"; exit 1
